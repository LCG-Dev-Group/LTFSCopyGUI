[package]
name = "ltfscopy-schema"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "ltfscopy_schema"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
hashbrown = "0.17.1"
quick-xml = { version = "0.42.0", default-features = false }
rayon = "1.12.0"
memmap2 = "0.9.11"

[profile.release]
lto = true
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
debug = 2
