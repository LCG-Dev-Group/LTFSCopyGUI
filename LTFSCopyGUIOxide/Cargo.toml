[package]
name = "ltfscopy-oxide"
version = "0.1.0"
edition.workspace = true

[lib]
name = "ltfscopy_oxide"
crate-type = ["cdylib"]

[dependencies]
ltfscopy-fastreader = { path = "crates/fastreader" }
ltfscopy-schema = { path = "crates/schema" }

[workspace]
members = ["crates/fastreader", "crates/schema"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
blake3 = "1.8"
crc32fast = "1.5"
md-5 = "0.11"
mimalloc = "0.1.52"
rustc-hash = "2.1"
sha1 = "0.11"
sha2 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
hashbrown = "0.17.1"
quick-xml = { version = "0.42.0", default-features = false }
rayon = "1.12.0"
memmap2 = "0.9.11"

[profile.release]
lto = true
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
debug = 2
