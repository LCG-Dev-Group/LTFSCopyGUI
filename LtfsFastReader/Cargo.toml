[package]
name = "ltfscopy-fastreader"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "ltfscopy_fastreader"
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ltfscopy-fastreader-bench"
path = "src/bin/ltfscopy-fastreader-bench.rs"

[dependencies]
blake3 = "1.8"
crc32fast = "1.5"
md-5 = "0.11"
rustc-hash = "2.1"
sha1 = "0.11"
sha2 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
panic = "abort"
debug = 1
